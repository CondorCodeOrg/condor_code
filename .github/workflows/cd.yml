name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  FLUTTER_VERSION: "3.35.0"

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Generate code
        run: dart run melos run generate

      - name: Write prod Firebase options (main app)
        env:
          FIREBASE_OPTIONS_PROD_APP: ${{ secrets.FIREBASE_OPTIONS_PROD_APP }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_PROD_APP" ]; then
            echo "FIREBASE_OPTIONS_PROD_APP secret is not set. Add the full contents of firebase_options_prod.dart in GitHub Actions secrets."
            exit 1
          fi
          printf '%s' "$FIREBASE_OPTIONS_PROD_APP" > apps/condor_code_app/lib/config/firebase/firebase_options_prod.dart

      - name: Write prod Firebase options (admin app)
        env:
          FIREBASE_OPTIONS_PROD_ADMIN: ${{ secrets.FIREBASE_OPTIONS_PROD_ADMIN }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_PROD_ADMIN" ]; then
            echo "FIREBASE_OPTIONS_PROD_ADMIN secret is not set. Add the full contents of firebase_options_prod.dart in GitHub Actions secrets."
            exit 1
          fi
          printf '%s' "$FIREBASE_OPTIONS_PROD_ADMIN" > apps/condor_code_admin_app/lib/config/firebase/firebase_options_prod.dart

      - name: Build condor_code web
        run: cd apps/condor_code_app && flutter build web -t lib/main.dart --dart-define=BUILD_TYPE=prod --dart-define=DATA_SOURCE=remote

      - name: Build condor_code_admin web
        run: cd apps/condor_code_admin_app && flutter build web -t lib/main.dart --dart-define=BUILD_TYPE=prod --dart-define=DATA_SOURCE=remote
